<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗓️ ตารางเรียน</title>
<link rel="stylesheet" href="school.css">
<style>
  .tblwrap{overflow-x:auto}
  table.sched{width:100%; border-collapse:separate; border-spacing:1px; background:var(--border); min-width:1120px}
  table.sched th, table.sched td{border:none}
  /* หัว */
  table.sched thead th{background:var(--card2); color:var(--txt); font-size:11px; font-weight:700;
    padding:7px 4px; white-space:nowrap; position:sticky; top:0; z-index:2}
  table.sched thead th.dayh{background:var(--accent); color:#fff; font-size:13px; min-width:92px}
  table.sched thead th.hour2{background:var(--card2)}
  /* แถววัน */
  table.sched td.dname{background:var(--card2); color:var(--txt); font-size:13px; font-weight:700;
    text-align:center; padding:8px 6px; white-space:nowrap; min-width:92px}
  table.sched td.dname.today{background:var(--accent); color:#fff}
  table.sched td.cell{background:var(--card); padding:0; height:56px}
  table.sched td.cell.dim{background:rgba(139,152,179,.04)}
  /* วิชา (td class=cl) */
  table.sched td.cl{background:rgba(34,211,238,.13); padding:7px 9px; font-size:11px;
    border-left:4px solid var(--accent2); cursor:pointer; vertical-align:middle; min-height:100%; height:100%}
  table.sched td.cl:hover{filter:brightness(1.18)}
  table.sched td.cl .nm{font-size:11px; font-weight:700; color:var(--txt); line-height:1.25}
  table.sched td.cl .rm{color:var(--muted); font-size:10px; margin-top:3px}
  table.sched td.cl .tm{color:var(--accent2); font-size:10px; margin-top:2px}
  table.sched td.cl.overlay{background:rgba(217,70,239,.14); border-left-color:#d946ef; font-style:italic}
  /* หัวชั่วโมงครึ่งชั่วโมง: label ที่ช่องคู่ (เช่น 8:00,9:00) */
  table.sched thead th.hh{font-size:10px; font-weight:600; color:var(--muted)}
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-bottom:14px}
  .legend .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
  #detail{position:fixed; inset:0; background:rgba(4,8,16,.78); display:none; align-items:center; justify-content:center; z-index:50; padding:20px}
  #detail.open{display:flex}
  .sheet{background:var(--card); border:1px solid var(--border); border-radius:16px; max-width:560px; width:100%; max-height:84vh; overflow:auto; padding:22px}
  .sheet .hh{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .sheet .hh h2{font-size:17px; margin:0 0 4px}
  .sheet .close{background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; line-height:1}
  .assign{background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:10px}
  .assign .ttl{font-size:13px; font-weight:600}
  .assign .meta{font-size:11px; color:var(--muted); margin-top:6px}
  .assign .meta b{color:var(--txt); font-weight:600}
  .empty{color:var(--muted); font-size:12px; padding:16px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <span style="color:var(--muted);font-size:13px;padding:7px 0"><a href="index.html">← My Hub</a></span>
    <a href="today.html">📚 เช็คงานวันนี้</a>
    <a href="schedule.html" class="on">🗓️ ตารางเรียน</a>
    <a href="trading.html">📊 Trading</a>
  </div>
  <header>
    <div>
      <h1>ตาราง<span class="dot">เรียน</span></h1>
      <div class="sub" id="sub">กำลังโหลด…</div>
    </div>
    <div class="live" id="live" style="font-size:12px;color:var(--muted)"></div>
  </header>
  <div class="err" id="errbox"></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--accent2)"></span>คาบประจำ</span>
    <span><span class="sw" style="background:#d946ef"></span>วิชาชดเชย / สอบ (จาก Calendar)</span>
  </div>
  <div class="tblwrap">
    <table class="sched" id="sched">
      <thead id="schedHead"></thead>
      <tbody id="schedBody"></tbody>
    </table>
  </div>
</div>

<div id="detail"><div class="sheet">
  <div class="hh">
    <div id="dtlHead"></div>
    <button class="close" onclick="closeDetail()">✕</button>
  </div>
  <div id="dtlBody"></div>
</div></div>

<script src="data/schedule.js"></script>
<script>
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์","อาทิตย์"];
const HH0=8, HH1=19;               // range 08:00–19:00
let ASSIGN_JSON={};

function $id(i){return document.getElementById(i);}
function fmt12(h){const hh=Math.floor(h), mm=Math.round((h-hh)*60); const ap=hh>=12?"PM":"AM"; const hr=((hh+11)%12)+1; return `${hr}:${String(mm).padStart(2,'0')} ${ap}`;}

// ── ตารางแบบมหาลัย: เวลาเป็นคอลัมน์(ครึ่งชั่วโมง), วันเป็นแถว (จันทร์–ศุกร์) ──
function halfIndex(h){ return Math.round((h-HH0)*2); }            // ช่องครึ่งชั่วโมงจาก 8:00
function hmLabel(h){ const hh=Math.floor(h); return `${String(hh).padStart(2,'0')}:00`; }

function renderTable(){
  const head=$id('schedHead'), body=$id('schedBody');
  const days=DAYS.slice(0,5);                       // จ-ศ
  const jd=(new Date().getDay()+6)%7+1;             // 1=จันทร์ .. 5=ศุกร์
  // ── หัวตาราง: Day/Time + ครึ่งชั่วโมงทุกช่อง (label ที่หัวชั่วโมงเต็ม) ──
  let hh=`<tr><th class="dayh">Day/Time</th>`;
  for(let h=HH0; h<HH1; h++){
    hh+=`<th class="hh">${hmLabel(h)}</th><th class="hour2"></th>`;   // 2 ช่อง/ชั่วโมง (ครึ่งชั่วโมง)
  }
  hh+=`</tr>`;
  head.innerHTML=hh;
  // จำนวนช่องครึ่งชั่วโมงรวม = (HH1-HH0)*2
  const totalHalf=(HH1-HH0)*2;
  // ── แถววัน + วิชา ──
  let trs='';
  days.forEach((dn,i)=>{
    const day=i+1;
    const jd_today = day===jd;
    let row=`<tr><td class="dname ${jd_today?'today':''}">${dn}</td>`;
    // สร้าง grid ของช่องเรียน (index ครึ่งชั่วโมง) แล้ววางวิชา
    const cells=new Array(totalHalf).fill(null);     // null = ว่าง, หรือ {cls,span}
    (window.SCHEDULE||[]).filter(s=>s.day===day).sort((a,b)=>a.start-b.start).forEach(s=>{
      const startH=halfIndex(s.start), span=Math.max(1, halfIndex(s.end)-startH);
      cells[startH]={startH,span,s,overlay:false};
    });
    // ── วาด: คั่นช่องหัว/ท้ายของวิชาด้วยเทคนิคเดียวกับมหาลัย ──
    let col=0, segs=[];
    for(let c=0;c<totalHalf;c++){
      const it=cells[c];
      if(it){
        segs.push({type:'cl',it});
        c += it.span-1;
      } else {
        segs.push({type:'gap'});
      }
    }
    // build td
    segs.forEach(seg=>{
      if(seg.type==='gap'){
        row+=`<td class="cell"></td>`;
      } else {
        const {s}=seg.it;
        const c=(window.COURSES&&window.COURSES[s.code])||{name:s.code,color:'#22d3ee'};
        const span=seg.it.span;
        row+=`<td colspan="${span}" class="cl" style="border-left-color:${c.color};background:${shade(c.color)}"
                         onclick="openDetail('${s.code}','${c.name}')">
                  <div class="nm">${c.name}</div>
                  <div class="rm">${s.room}</div>
                  <div class="tm">${fmt12(s.start)}–${fmt12(s.end)}</div></td>`;
              }
    });
    row+=`</tr>`;
    trs+=row;
  });
  body.innerHTML=trs;
}
function shade(hex){ // ทำสี background อ่อนๆ จากสีวิชา
  const n=parseInt(hex.slice(1),16), r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgba(${r},${g},${b},.14)`;
}

function courseAssignments(code){ const map=ASSIGN_JSON.byCourse||{}; return map[code]||null; }
function openDetail(code, displayName){
  const c=(window.COURSES[code])||{name:code,color:'#22d3ee'};
  const a=courseAssignments(code);
  $id('dtlHead').innerHTML=`<h2 style="color:${c.color}">${displayName||c.name}</h2>
    <div class="when">รหัส ${code}</div>`;
  if(a && a.length){
    $id('dtlBody').innerHTML=`<div style="font-size:12px;color:var(--muted);margin-bottom:6px">งานที่ต้องส่ง (${a.length} รายการ)</div>`+
      a.map(x=>{
        const bd=x.overdue>0?'b-over':(x.overdue===0?'b-today':'b-soon');
        const bl=x.overdue>0?'เลยกำหนด '+x.overdue+' วัน':(x.overdue===0?'ครบวันนี้':'ครบใน '+x.overdue+' วัน');
        return `<div class="assign"><div class="ttl">${x.title}</div>
          <div class="meta">ครบ <b>${x.due}</b> · <span class="badge ${bd}">${bl}</span></div></div>`;
      }).join('');
  } else {
    $id('dtlBody').innerHTML=`<div class="empty">ไม่มีงานค้างในวิชานี้ เก่งมาก 👍</div>`;
  }
  $id('detail').classList.add('open');
}
function closeDetail(){ $id('detail').classList.remove('open'); }
$id('detail').onclick=e=>{ if(e.target.id==='detail') closeDetail(); };

async function init(){
  renderTable();
  try{
    const ev=await fetch('data/schedule.json',{cache:'no-store'});
    if(ev.ok){
      const d=await ev.json();
      if(d.updated){ const dt=new Date(d.updated); $id('live').textContent='ซิงก์เมื่อ '+dt.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' (Calendar)'; }
      // overlay events ย้ำเฉพาะวันของสัปดาห์นี้ (โดยไม่มีข้อมูลวันที่จริง ยังแสดง recurring ตาม day)
    }
  }catch(e){ $id('errbox').style.display='block'; $id('errbox').textContent='⚠ overlay Calendar ใช้ไม่ได้: '+e.message; }
  updateTodayInfo();
}
function updateTodayInfo(){
  const jd=(new Date().getDay()+6)%7+1;
  const sub=$id('sub');
  const todayCourse=window.SCHEDULE.filter(s=>s.day===jd);
  if(todayCourse.length){
    const names=todayCourse.map(s=>(window.COURSES[s.code]||{}).name||s.code);
    sub.textContent='วันนี้ ('+DAYS[jd-1]+') มี '+todayCourse.length+' คาบ: '+names.join(' · ');
  } else {
    sub.textContent='วันนี้ ('+DAYS[jd-1]+') ไม่มีคาบเรียน';
  }
}
init();
</script>
</body>
</html>
