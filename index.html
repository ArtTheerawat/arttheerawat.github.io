<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Bot Dashboard — XAUUSD / BTC</title>
<style>
  :root{
    --bg:#0f1521; --card:#171f2e; --card2:#1d2638; --border:#273349;
    --txt:#e6ebf5; --muted:#8b98b3; --up:#22c55e; --down:#ef4444;
    --accent:#6366f1; --accent2:#22d3ee;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; min-height:100vh}
  .wrap{max-width:1200px; margin:0 auto; padding:24px}
  header{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:8px}
  h1{font-size:24px; font-weight:700; letter-spacing:.5px}
  h1 .dot{color:var(--accent2)}
  .sub{color:var(--muted); font-size:13px; margin-top:2px}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .live .pd{width:9px;height:9px;border-radius:50%;background:var(--down)}
  .live.ok .pd{background:var(--up); box-shadow:0 0 8px var(--up)}
  .src{margin:8px 0 20px; font-size:12px; color:var(--muted); word-break:break-all}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:22px}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px}
  .kpi .lbl{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px}
  .kpi .val{font-size:28px; font-weight:700; margin-top:6px}
  .kpi .note{font-size:11px; color:var(--muted); margin-top:2px}
  .up{color:var(--up)} .down{color:var(--down)}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:22px}
  .card h2{font-size:16px; margin-bottom:14px; display:flex; align-items:center; gap:8px}
  .card h2 .tag{margin-left:auto; font-size:11px; color:var(--muted); font-weight:400}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--border)}
  th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap}
  td .sig{font-weight:700}
  .sig.BUY{color:var(--up)} .sig.SELL{color:var(--down)} .sig.NONE{color:var(--muted)}
  .badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600}
  .b-open{background:rgba(99,102,241,.15); color:#a5b4fc}
  .b-won{background:rgba(34,197,94,.15); color:var(--up)}
  .b-lost{background:rgba(239,68,68,.15); color:var(--down)}
  .pct{color:var(--muted); font-size:12px}
  .empty{text-align:center; padding:38px 0; color:var(--muted)}
  .empty .big{font-size:30px; margin-bottom:8px}
  .bars{display:flex; align-items:flex-end; gap:6px; height:130px; margin-top:14px}
  .bar{flex:1; background:linear-gradient(180deg,var(--accent),var(--accent2)); border-radius:4px 4px 0 0; min-height:2px; position:relative}
  .bar span{position:absolute; top:-18px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted)}
  .bar .lbl{position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:10px; color:var(--muted)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .err{background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.4); color:#fecaca; border-radius:12px; padding:16px; margin-bottom:20px; font-size:13px}
  footer{color:var(--muted); font-size:11px; text-align:center; margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Trading Bot <span class="dot">Dashboard</span></h1>
      <div class="sub">XAUUSD (Gold) · BTCUSD · Multi-Timeframe Trend Following</div>
    </div>
    <div class="live" id="livebadge"><span class="pd"></span><span id="livetxt">กำลังโหลด…</span></div>
  </header>

  <div class="src" id="sourceInfo"></div>
  <div class="err" id="errbox" style="display:none"></div>

  <section class="kpis" id="kpis"></section>

  <div class="grid2">
    <div class="card">
      <h2>📊 Performance <span class="tag">รายวัน</span></h2>
      <div id="perfArea"></div>
    </div>
    <div class="card">
      <h2>💹 P&L <span class="tag">Net / วัน</span></h2>
      <div class="bars" id="pnlBars"></div>
    </div>
  </div>

  <div class="card">
    <h2>🛒 Trades <span class="tag" id="tradesCount">live</span></h2>
    <div id="tradesArea"></div>
  </div>

  <div class="card">
    <h2>📡 Signals <span class="tag">live จาก sheet</span></h2>
    <div id="signalsArea"></div>
  </div>

  <footer>Auto-generated by Hermes · data read live from Google Sheets (CSV)</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
