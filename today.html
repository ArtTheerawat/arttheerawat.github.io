<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 เช็คงานวันนี้</title>
<link rel="stylesheet" href="school.css">
<style>
  .dayhead{display:flex; align-items:baseline; gap:12px; margin-bottom:18px; flex-wrap:wrap}
  .dayhead .d{font-size:15px; color:var(--muted)}
  .quizban{background:linear-gradient(90deg,rgba(217,70,239,.16),rgba(99,102,241,.1)); border:1px solid rgba(217,70,239,.4);
    border-radius:12px; padding:14px 16px; margin-bottom:18px}
  .quizban h3{font-size:14px; color:#f0abfc; margin-bottom:8px}
  .quizban .q{display:flex; justify-content:space-between; gap:10px; align-items:center; font-size:13px; padding:6px 0; border-bottom:1px dashed rgba(217,70,239,.25)}
  .quizban .q:last-child{border-bottom:none}
  .grp h2{font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px}
  .grp h2 .cnt{font-size:11px; color:var(--muted); font-weight:400}
  .item{background:var(--card); border:1px solid var(--border); border-left:4px solid var(--accent2);
    border-radius:10px; padding:14px; margin-bottom:10px}
  .item .pd{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:6px}
  .item .ttl{font-size:14px; font-weight:600}
  .item .subj{font-size:12px; color:var(--accent2); margin-top:4px}
  .item.over{border-left-color:var(--down)}
  .stripes{background:repeating-linear-gradient(45deg,rgba(239,68,68,.06),rgba(239,68,68,.06) 8px,transparent 8px,transparent 16px)}
  .togglenext{background:none; border:none; color:var(--accent2); font-size:12px; cursor:pointer; margin-top:4px}
  .counts{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px}
  .counts .c{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:12px}
  .counts .c b{font-size:20px; display:block; margin-bottom:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <span style="color:var(--muted);font-size:13px;padding:7px 0"><a href="index.html">← My Hub</a></span>
    <a href="today.html" class="on">📚 เช็คงานวันนี้</a>
    <a href="schedule.html">🗓️ ตารางเรียน</a>
    <a href="trading.html">📊 Trading</a>
  </div>
  <header>
    <div>
      <h1>เช็ค<span class="dot">งาน</span>วันนี้</h1>
      <div class="dayhead"><div class="sub" id="sub">กำลังโหลด…</div></div>
    </div>
    <div style="font-size:12px;color:var(--muted)" id="live"></div>
  </header>
  <div class="err" id="errbox"></div>

  <div class="counts" id="counts"></div>
  <div class="quizban" id="quizban" style="display:none">
    <h3>🔔 แจ้งเตือนสอบ / กิจกรรมใกล้ถึง</h3>
    <div id="quizlist"></div>
  </div>
  <div id="groups"></div>
</div>

<script>
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์","อาทิตย์"];
let ALL=[]; let courses=[];

function $id(i){return document.getElementById(i);}
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const p=iso.split('-'); const y=+p[1], d=+p[2]; const names=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return `${d} ${names[y-1]}`; }

function classify(x){
  if(!x.due){ x.bucket='soon'; x.bucketLabel='งานไม่ระบุวัน'; x.overdue=999; return; }
  const t=new Date(x.due+'T00:00:00'); const today=new Date(todayStr()+'T00:00:00');
  const diff=Math.round((t-today)/86400000);
  x.overdue = diff<0 ? -diff : 0;
  if(diff<0) x.bucket='over';
  else if(diff===0) x.bucket='today';
  else if(diff<=5) x.bucket='soon';
  else x.bucket='later';
}

function render(){
  const today=todayStr();
  $id('sub').textContent='วันนี้ '+DAYS[(new Date().getDay()+6)%7]+' · '+today;
  const over=ALL.filter(a=>a.bucket==='over');
  const tod=ALL.filter(a=>a.bucket==='today');
  const soon=ALL.filter(a=>a.bucket==='soon');
  const later=ALL.filter(a=>a.bucket==='later');
  const quiz=(window.QUIZZES||[]);

  // summary counts
  $id('counts').innerHTML=`
    <div class="c"><b class="down" style="color:var(--down)">${over.length}</b>เลยกำหนด</div>
    <div class="c"><b style="color:var(--warn)">${tod.length}</b>ครบวันนี้</div>
    <div class="c"><b style="color:var(--accent2)">${soon.length}</b>ใกล้ถึง (5 วัน)</div>
    <div class="c"><b>${quiz.length}</b>สอบ/กิจกรรม</div>`;

  // quizzes
  if(quiz.length){
    $id('quizban').style.display='block';
    $id('quizlist').innerHTML=quiz.map(q=>{
      const diff=Math.round((new Date(q.date+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
      const when = diff<0?`ผ่านมา ${-diff} วัน`:(diff===0?'วันนี้!':`ใน ${diff} วัน`);
      return `<div class="q"><span>${q.summary}</span>
        <span class="badge ${diff<=3?'b-quiz':'b-soon'}">${fmtDate(q.date)} · ${when}</span></div>`;
    }).join('');
  }

  const grp=$id('groups');
  const sec=(label,badge,items)=>{ if(!items.length) return '';
    return `<div class="grp" style="margin-top:8px"><h2>${label} <span class="cnt">${items.length}</span></h2>${items.join('')}</div>`; };

  const it=(a, overcl)=>`<div class="item ${overcl?'over':''}">
      <div class="pd"><span class="badge ${a.bucket==='over'?'b-over':a.bucket==='today'?'b-today':a.bucket==='soon'?'b-soon':'b-done'}">${a.bucket==='over'?'เลย '+a.overdue+' วัน':a.bucket==='today'?'ครบวันนี้':a.bucket==='soon'?'ครบใน '+a.overdue+' วัน':'ครบแล้ว'}</span>
      <span>⏰ ${fmtDate(a.due)}</span></div>
      <div class="ttl">${a.title}</div>
      <div class="subj">${a.courseName||a.course||''}</div>
    </div>`;

  grp.innerHTML =
    sec('🔴 เลยกำหนด ต้องรีบทำ', 'b-over', over.map(a=>it(a,true))) +
    sec('⏳ ครบกำหนดวันนี้', 'b-today', tod.map(a=>it(a))) +
    sec('🟣 ใกล้ถึง (5 วัน)', 'b-soon', soon.map(a=>it(a))) +
    (later.length?`<div class="grp" style="margin-top:8px"><h2>📅 อีกไกล <span class="cnt">${later.length}</span></h2>
      <button class="togglenext" onclick="showLater()">แสดงงานที่ยังอีกไกล (${later.length}) ▼</button><div id="laterbox"></div></div>`:'') +
    (!over.length&&!tod.length&&!soon.length ? `<div class="card" style="text-align:center;padding:34px"><div style="font-size:30px;margin-bottom:8px">🎉</div><div style="color:var(--muted)">วันนี้ไม่มีงานค้าง / ครบส่ง ค่อยๆ ผ่อนได้</div></div>` : '');

  window._later=later;
}
function showLater(){ $id('laterbox').innerHTML=$id('laterbox').innerHTML.length? '' : window._later.map(a=>{const o=Math.round((new Date(a.due)-new Date(todayStr()))/86400000);return `<div class="item"><div class="pd"><span class="badge b-soon">ครบใน ${o} วัน</span><span>⏰ ${fmtDate(a.due)}</span></div><div class="ttl">${a.title}</div><div class="subj">${a.courseName||a.course||''}</div></div>`; }).join(''); }

async function init(){
  try{
    const r=await fetch('data/assignments.json',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    ALL=(j.todo||[]);
    courses=j.courseNames||{};
    try{
      const q=await fetch('data/schedule.json',{cache:'no-store'});
      if(q.ok){ const qj=await q.json(); window.QUIZZES=(qj.quizzes||[]); }
    }catch(e){}
    if(j.updated){ const d=new Date(j.updated); $id('live').textContent='ซิงก์ '+d.toLocaleString('th-TH',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
    ALL.forEach(classify);
  }catch(e){
    $id('errbox').style.display='block';
    $id('errbox').textContent='⚠ โหลดข้อมูลไม่ได้: '+e.message+' (รัน cron ซิงก์แล้วลองใหม่)';
  }
  render();
}
init();
</script>
</body>
</html>
